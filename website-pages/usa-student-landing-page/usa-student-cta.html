<!-- ============================================================
     STUDENT LUXE — USA Student Landing Page: Final CTA
     Paste into a Squarespace Code Block.
     Standalone: no shared styles block required.
     Background: set to navy (#0d1a2e) in Squarespace.
     Enquiry CTA links to the reservations form with no city
     preset - the guest picks their US city in the form.
     Ghost CTA anchors to the city tabs section
     (#stl-destinations, the cities carousel block).
     ============================================================ -->
<style>
.slp-cta {
  --pill-font-size:        11px;
  --pill-letter-spacing:   0.16em;
  --pill-color:            #D4B896;
  --title-font-size:       clamp(35px, 6vw, 60px);
  --title-font-weight:     300;
  --title-line-height:     1.00;
  --title-letter-spacing:  -0.04em;
  --title-color:           #ffffff;
  --title-em-color:        #D4B896;
  --body-font-size:        13px;
  --body-color:            rgba(255,255,255,0.90);
  --body-line-height:      1.5;
  --body-max-width:        460px;
  --ghost-font-size:       13px;
  --ghost-color:           rgba(255,255,255,0.6);
  --ghost-letter-spacing:  0.06em;
}

.slp-cta * { box-sizing: border-box; margin: 0; padding: 0; }
.slp-cta {
  background: transparent;
  padding: 0;
  font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.slp-cta-inner {
  max-width: 1080px;
  margin: 0 auto;
}

.slp-cta-main {
  padding: 80px 48px;
  text-align: center;
}

.slp-cta-pill-wrap { margin-bottom: 32px; }
.slp-cta-pill {
  display: inline-block;
  padding: 6px 18px;
  background: rgba(184,150,110,0.15);
  border: 0.5px solid rgba(184,150,110,0.35);
  border-radius: 20px;
  font-size: var(--pill-font-size);
  font-weight: 400;
  letter-spacing: var(--pill-letter-spacing);
  text-transform: uppercase;
  color: var(--pill-color);
}

.slp-cta-title {
  font-size: var(--title-font-size);
  font-weight: var(--title-font-weight);
  line-height: var(--title-line-height);
  letter-spacing: var(--title-letter-spacing);
  color: var(--title-color);
  margin: 0 auto 20px;
  max-width: 700px;
}
.slp-cta-title em { font-style: italic; color: var(--title-em-color); }

.slp-cta-body {
  font-size: var(--body-font-size);
  color: var(--body-color);
  line-height: var(--body-line-height);
  max-width: var(--body-max-width);
  margin: 0 auto 40px;
}

.slp-cta-btns {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.slp-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #B8966E;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 10px 24px;
  font-family: 'DM Sans', Helvetica, Arial, sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  transition: background 0.15s cubic-bezier(0.23, 1, 0.32, 1),
              transform 0.1s cubic-bezier(0.23, 1, 0.32, 1);
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine) {
  .slp-cta-btn:hover { background: #D4B896; }
}
.slp-cta-btn:active { transform: scale(0.97); }

.slp-cta-btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: #ffffff;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 4px;
  background: rgba(255,255,255,0.12);
  transition: border-color 0.15s cubic-bezier(0.23, 1, 0.32, 1),
              background 0.15s cubic-bezier(0.23, 1, 0.32, 1),
              transform 0.1s cubic-bezier(0.23, 1, 0.32, 1);
  white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) {
  .slp-cta-btn-ghost:hover {
    border-color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.2);
  }
}
.slp-cta-btn-ghost:active { transform: scale(0.97); }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .slp-cta-main { padding: 48px 24px; }
  .slp-cta-btns { flex-direction: column; gap: 16px; }
}
</style>

<section class="slp-cta">
  <div class="slp-cta-inner">
    <div class="slp-cta-main">
      <div class="slp-cta-pill-wrap">
        <span class="slp-cta-pill">Get in touch</span>
      </div>
      <h2 class="slp-cta-title">
        Let us help find your<br><em>apartment in the USA.</em>
      </h2>
      <p class="slp-cta-body">
        Speak to a real member of our team today. Tell us where you're going and what you're looking for - we'll listen, advise, and find the home that truly fits you, with no pressure and no placement fee.
      </p>
      <div class="slp-cta-btns">
        <a href="/reservations?type=B" class="slp-cta-btn">Make an enquiry →</a>
        <a href="#stl-destinations" class="slp-cta-btn-ghost">Browse cities ↑</a>
      </div>
    </div>
  </div>
</section>
