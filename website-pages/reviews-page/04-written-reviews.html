<!-- ============================================================
     STUDENT LUXE - Chorus Reviews : SECTION 4 - WRITTEN REVIEWS
     Self-contained. Paste into its own Code Block.
     Self-hosted Google review wall, 6 shown at a time with a
     "show more" button. Long quotes clamp to 6 lines with a
     Read more toggle. Edit the REVIEWS array in the script.
     ============================================================ -->
<style>
.sl-chorus{
  --paper:#FBF8F1; --card:#ffffff; --ink:#0d1a2e;
  --muted:rgba(13,26,46,.52); --hair:rgba(13,26,46,.12);
  --gold:#B8966E; --gold-deep:#8B6E4E;
  --shadow-card:0 1px 2px rgba(13,26,46,.05),0 12px 34px rgba(13,26,46,.08);
  --serif:'baskerville-display-pt',Georgia,'Times New Roman',serif;
  --sans:'dm-sans',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --gara:'adobe-garamond-pro',Georgia,serif;
  --ease:cubic-bezier(.22,.8,.28,1);
  font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.sl-chorus *{ box-sizing:border-box; }
.sl-chorus.chorus-section{ padding:40px 24px; }
.sl-chorus .chorus-wrap{ max-width:1180px; margin:0 auto; }
.chorus-gg{ width:11px; height:11px; flex-shrink:0; display:inline-block; }

.chorus-sec{ margin:0 0 22px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.chorus-sec-title{ font-family:var(--serif); font-weight:400; font-size:clamp(26px,3.4vw,38px); line-height:1.05; letter-spacing:-.05em; margin:0; color:var(--ink); }
.chorus-sec-title em{ font-style:italic; color:var(--gold); }
.chorus-sec-note{ font-family:var(--gara); font-style:italic; font-size:14px; color:var(--muted); }

.chorus-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px; align-items:start; }
@media (max-width:640px){ .chorus-grid{ grid-template-columns:1fr; } }
.chorus-card{
  background:var(--card); border:1px solid var(--hair); border-radius:14px;
  padding:24px 24px 20px; box-shadow:var(--shadow-card);
  opacity:0; transition:opacity .6s var(--ease);
}
.chorus-card.in{ opacity:1; }
.chorus-card-stars{ display:flex; gap:3px; margin-bottom:13px; }
.chorus-card-stars svg{ width:13px; height:13px; fill:var(--gold); }
.chorus-quote{
  font-family:var(--gara); font-size:16px; line-height:1.58; letter-spacing:.005em; color:var(--ink); margin:0;
  display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden;
}
.chorus-card.expanded .chorus-quote{ display:block; -webkit-line-clamp:unset; overflow:visible; }
.chorus-toggle{
  display:inline-flex; align-items:center; gap:5px; margin-top:9px; padding:0; background:none; border:none; cursor:pointer;
  font-family:var(--sans); font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-deep); transition:color .15s;
}
.chorus-toggle:hover{ color:var(--ink); }
.chorus-toggle svg{ width:9px; height:9px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
.chorus-card.expanded .chorus-toggle svg{ transform:rotate(180deg); }
.chorus-card.no-overflow .chorus-toggle{ display:none; }
.chorus-attr{ display:flex; align-items:center; gap:11px; margin-top:16px; padding-top:15px; border-top:1px solid var(--hair); }
.chorus-avatar{ width:34px; height:34px; min-width:34px; border-radius:50%; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; letter-spacing:.02em; }
.chorus-attr-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.chorus-name{ font-size:13px; font-weight:600; color:var(--ink); letter-spacing:-.005em; }
.chorus-source{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--gold-deep); letter-spacing:.02em; text-decoration:none; transition:color .15s; }
.chorus-source:hover{ color:var(--ink); text-decoration:underline; text-underline-offset:2px; }

.chorus-more-wrap{ text-align:center; margin:34px 0 0; }
.chorus-more{
  display:inline-flex; align-items:center; gap:8px; padding:13px 30px; border-radius:8px;
  background:transparent; color:var(--ink); border:1px solid var(--ink); cursor:pointer;
  font-family:var(--sans); font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  transition:background .2s var(--ease), color .2s var(--ease);
}
.chorus-more:hover{ background:var(--ink); color:var(--paper); }
.chorus-more svg{ width:13px; height:13px; }
.chorus-more.done{ display:none; }
@media (max-width:640px){ .sl-chorus.chorus-section{ padding:32px 16px; } }
@media (prefers-reduced-motion:reduce){ .chorus-card{ opacity:1 !important; transition:none !important; } }
</style>

<div class="sl-chorus chorus-section">
  <div class="chorus-wrap">
    <div class="chorus-sec">
      <h2 class="chorus-sec-title">In their <em>own words.</em></h2>
      <span class="chorus-sec-note">Verified Google reviews</span>
    </div>
    <div class="chorus-grid" id="chorusGrid"></div>
    <div class="chorus-more-wrap">
      <button class="chorus-more" id="chorusMore" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Show more reviews
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  var REVIEWS_PER_PAGE = 6;

  /* ── REVIEW CONFIG - edit here ── */
  var REVIEWS = [
    { name:'Holly Clarke', initials:'HC',
      quote:'We used Student Luxe housing for our daughter who was studying abroad in London. They were very helpful during the search process to listen to our needs and help us find the perfect place. We chose a location that was a combo boutique hotel / residence which gave her the best of both worlds. The location was fantastic. The Student Luxe team was responsive and literally took care of everything. Everything was exactly as advertised. They made the process very easy. I highly recommend them.',
      url:'https://maps.app.goo.gl/7n5h5Y9ehEHEy4Ga6' },
    { name:'Felix Oljons', initials:'FO',
      quote:'Amazing service and wonderful selection of apartments. They made everything feel seamless. Would highly recommend for students who value higher degree of freedom in contract length and quality apartments to make your time in London truly special.',
      url:'https://maps.app.goo.gl/Ktv7X4dspcgu4fVC7' },
    { name:'Alina Elena Olariu', initials:'AO',
      quote:'Student Luxe has been such a helpful source for us to find accommodation for our daughter while she has been at university. It assures me that she is in a safe and well looked after environment and on top of that offers the best and most central locations! A special thank you goes to Mo for guiding us through the process and remaining at our disposal for two years now!',
      url:'https://maps.app.goo.gl/4DYpRd9tYZgupLMf8' },
    { name:'Barbie Lee', initials:'BL',
      quote:'I had an excellent experience with Student Luxe, especially thanks to the amazing help from Rongrong and Lina. After an unexpected issue with my first accommodation, Rongrong patiently guided me through the process of finding and securing a new place. She was understanding, professional, and made what could have been a stressful situation feel manageable. Once I moved in, Lina provided outstanding follow-up support, particularly with arranging my luggage delivery. She was responsive, proactive, and ensured everything went smoothly. Overall, I’m very grateful for their kindness and efficiency. Highly recommend Student Luxe, and especially Rongrong and Lina, to any student looking for reliable and caring housing support!',
      url:'https://maps.app.goo.gl/bydUcsGqHWqHGCqm6' },
    { name:'Sher Singh', initials:'SS',
      quote:'Katria is an absolute gem! She helped me find the perfect accommodation close to the university, tailored to my son’s needs. Not only was she professional and friendly, but she also showed incredible kindness. She even went the extra mile, providing an airfryer when the unit didn’t have one! As a foreign parent, I appreciated her understanding and efforts in securing a suitable unit. She regularly checked in to ensure I was happy and resolved any issues promptly. Highly recommend Katria and Student Luxe!',
      url:'https://maps.app.goo.gl/wvpWYWQVAqj7TQMz5' },
    { name:'Débora Toledo', initials:'DT',
      quote:'I had a great experience with Student Luxe. Stefan Hrebenciuc provided VIP service, always attentive and quick to respond, ensuring peace of mind throughout my stay. Truly professional and dedicated!',
      url:'https://maps.app.goo.gl/7F5GRmGtPvNzLyCi7' },
    { name:'Mahmoud Arif', initials:'MA',
      quote:'I arrived in London a day before my program started with a last minute cancellation of my pre-booked accommodation. When I spoke to Stefan at Student Luxe, he was very understanding and patient. It was a refreshing experience especially with the amount of difficult and unavailable agents around the city. Stefan helped find the best option, and give advice on payment, all while being personable and friendly. Thank you, Stefan! I definitely will be contacting Student Luxe again when I’m back in London.',
      url:'https://maps.app.goo.gl/UC1uUgu7C6W9Xzrn7' }
  ];

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var STAR = '<svg viewBox="0 0 14 14"><polygon points="7,1 8.7,5 13,5.4 9.7,8.3 10.7,12.6 7,10.3 3.3,12.6 4.3,8.3 1,5.4 5.3,5"/></svg>';
  var CHEV = '<svg viewBox="0 0 10 10"><polyline points="2,3.5 5,6.5 8,3.5"/></svg>';
  var GOOGLE_G = '<svg class="chorus-gg" viewBox="0 0 48 48" aria-hidden="true">' +
    '<path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>' +
    '<path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>' +
    '<path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>' +
    '<path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7C13.42 14.62 18.27 10.75 24 10.75z"/></svg>';

  var io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin:'0px 0px -8% 0px', threshold:0.05 })
    : null;
  function reveal(el){ if(io){ io.observe(el); } else { el.classList.add('in'); } }

  var grid = document.getElementById('chorusGrid');
  var moreBtn = document.getElementById('chorusMore');
  if(!grid || !moreBtn) return;
  var shown = 0;
  var cards = [];

  function buildCard(r){
    var cardEl = document.createElement('article');
    cardEl.className = 'chorus-card';
    var safeName = esc(r.name);
    cardEl.innerHTML =
      '<div class="chorus-card-stars" aria-label="5 out of 5 stars">' + STAR + STAR + STAR + STAR + STAR + '</div>' +
      '<p class="chorus-quote">' + esc(r.quote) + '</p>' +
      '<button class="chorus-toggle" type="button" aria-expanded="false"><span class="chorus-toggle-label">Read more</span>' + CHEV + '</button>' +
      '<div class="chorus-attr">' +
        '<div class="chorus-avatar" aria-hidden="true">' + esc(r.initials) + '</div>' +
        '<div class="chorus-attr-text">' +
          '<span class="chorus-name">' + safeName + '</span>' +
          '<a class="chorus-source" href="' + esc(r.url) + '" target="_blank" rel="noopener" aria-label="Read ' + safeName + '’s verified review on Google">' + GOOGLE_G + ' Verified on Google &rarr;</a>' +
        '</div>' +
      '</div>';
    var quote = cardEl.querySelector('.chorus-quote');
    var btn = cardEl.querySelector('.chorus-toggle');
    btn.addEventListener('click', function(){
      var expanded = cardEl.classList.toggle('expanded');
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      btn.querySelector('.chorus-toggle-label').textContent = expanded ? 'Read less' : 'Read more';
    });
    cardEl._checkClamp = function(){
      if(cardEl.classList.contains('expanded')) return;
      cardEl.classList.toggle('no-overflow', quote.scrollHeight <= quote.clientHeight + 2);
    };
    return cardEl;
  }
  function checkClamps(){ cards.forEach(function(c){ c._checkClamp(); }); }
  function showNext(){
    var batch = REVIEWS.slice(shown, shown + REVIEWS_PER_PAGE);
    batch.forEach(function(r){ var c = buildCard(r); cards.push(c); grid.appendChild(c); reveal(c); });
    shown += batch.length;
    if(shown >= REVIEWS.length) moreBtn.classList.add('done');
    requestAnimationFrame(checkClamps);
  }
  moreBtn.addEventListener('click', showNext);
  showNext();

  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(checkClamps); }
  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ requestAnimationFrame(checkClamps); }, 200); });
})();
</script>
