<!-- ============================================================
     STUDENT LUXE - Chorus Reviews : SECTION 3 - SOCIAL MOSAIC
     Self-contained. Paste into its own Code Block on /our-reviews.
     A masonry mosaic of mixed social content: TikToks, Instagram
     reels, Instagram posts, YouTube - each keeps its own shape.

     Fully self-hosted preview (no third-party embeds, so no crash
     risk on iOS Safari and no widget chrome): each tile shows the
     post image(s), the account handle on top, and a "View post
     on ..." link out. Carousel posts get chevrons + dots + swipe.

     NOTE ON CAROUSELS: Instagram will not hand its carousel images
     to a webpage without its authenticated API. So upload the
     post's images to Squarespace yourself and list their CDN urls
     in `images` below - that is what the chevrons scroll through.

     EDIT everything in the POSTS array in the script:
       platform : 'tiktok' | 'instagram' | 'youtube'
       url      : the public link to the post/video/reel
       shape    : 'reel' (Reels/TikTok 9:16) | 'portrait' (IG feed
                  post 4:5) | 'square' (1:1) | 'landscape' (16:9)
       images   : array of Squarespace CDN urls (the post's images).
                  Two or more -> chevrons + dots appear. This is the
                  preview; add at least one per post.
       account  : the handle shown on top, e.g. '@studentluxe'
       city,line: labels shown under the tile.
     ============================================================ -->
<style>
.sl-chorus{
  --paper:#FBF8F1; --ink:#0d1a2e; --muted:rgba(13,26,46,.52);
  --gold:#B8966E; --gold-deep:#8B6E4E;
  --gold-wash:rgba(184,150,110,.10); --gold-line:rgba(184,150,110,.42);
  --serif:'baskerville-display-pt',Georgia,'Times New Roman',serif;
  --sans:'dm-sans',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --gara:'adobe-garamond-pro',Georgia,serif;
  --ease:cubic-bezier(.22,.8,.28,1);
  font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.sl-chorus *{ box-sizing:border-box; }
.sl-chorus.chorus-section{ padding:8px 24px 40px; }   /* transparent; set the dark background on the Squarespace section */
.sl-chorus .chorus-wrap{ max-width:1180px; margin:0 auto; }

/* section heading - light, for a dark Squarespace section background */
.chorus-sec{ margin:0 0 22px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.chorus-sec-title{ font-family:var(--serif); font-weight:400; font-size:clamp(26px,3.4vw,38px); line-height:1.05; letter-spacing:-.05em; margin:0; color:#F4F0E6; }
.chorus-sec-title em{ font-style:italic; color:#D4B896; }
.chorus-sec-note{ font-family:var(--gara); font-style:italic; font-size:14px; color:rgba(244,240,230,.62); }

/* ── MOSAIC (CSS masonry: columns, mixed heights) ── */
.chorus-mosaic{ column-count:4; column-gap:12px; }
@media (max-width:1000px){ .chorus-mosaic{ column-count:3; } }
@media (max-width:700px){ .chorus-mosaic{ column-count:2; } }
@media (max-width:640px){ .sl-chorus.chorus-section{ padding:8px 16px 0; } .chorus-mosaic{ column-gap:10px; } }

.chorus-mtile{
  break-inside:avoid; margin:0 0 12px; position:relative;
  border-radius:14px; overflow:hidden; border:.5px solid var(--gold-line);
  background:#101d31; opacity:0;
  transition:opacity .6s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
}
.chorus-mtile.in{ opacity:1; }
.chorus-mtile:hover{ border-color:var(--gold); box-shadow:0 12px 30px rgba(10,16,26,.3); }
@media (max-width:640px){ .chorus-mtile{ margin-bottom:10px; } }

.chorus-mmedia{ position:relative; width:100%; background:#101d31; overflow:hidden; cursor:pointer;
  touch-action:pan-y; user-select:none; }
.chorus-mmedia.reel{ aspect-ratio:9/16; }
.chorus-mmedia.portrait{ aspect-ratio:4/5; }
.chorus-mmedia.square{ aspect-ratio:1/1; }
.chorus-mmedia.landscape{ aspect-ratio:16/9; }

/* image carousel track */
.chorus-mtrack{ position:absolute; inset:0; display:flex; transition:transform .4s var(--ease); }
.chorus-mtrack.no-anim{ transition:none; }
.chorus-mslide{ position:relative; flex:0 0 100%; width:100%; height:100%; }
.chorus-mslide img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
.chorus-mfallback{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  background:linear-gradient(160deg, #16263f 0%, #0d1a2e 60%, #0a1424 100%); }
.chorus-mfallback svg{ width:30px; height:30px; }
.chorus-mfallback span{ font-family:var(--gara); font-style:italic; font-size:13px; color:rgba(212,184,150,.72); }

/* account handle on top */
.chorus-mtop{ position:absolute; top:0; left:0; right:0; z-index:4; padding:12px 14px;
  display:flex; align-items:center; gap:8px; pointer-events:none;
  background:linear-gradient(to bottom, rgba(10,16,26,.6) 0%, rgba(10,16,26,0) 100%); }
.chorus-mavatar{ width:22px; height:22px; border-radius:50%; flex-shrink:0;
  background:rgba(251,248,241,.16); border:.5px solid rgba(251,248,241,.3);
  display:flex; align-items:center; justify-content:center; }
.chorus-mavatar svg{ width:12px; height:12px; fill:#F4F0E6; }
.chorus-mhandle{ font-size:11px; font-weight:600; letter-spacing:.01em; color:#F4F0E6; }
.chorus-mcount{ margin-left:auto; display:inline-flex; align-items:center; gap:4px;
  font-size:9px; letter-spacing:.06em; color:rgba(244,240,230,.9); }
.chorus-mcount svg{ width:12px; height:12px; fill:#F4F0E6; }

/* play glyph for single-image video shapes */
.chorus-mplay{ position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; z-index:3;
  border-radius:50%; background:rgba(251,248,241,.92); display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 24px rgba(10,16,26,.4); transition:background .25s var(--ease); pointer-events:none; }
.chorus-mplay svg{ width:16px; height:16px; fill:var(--ink); margin-left:2px; }
.chorus-mtile:hover .chorus-mplay{ background:var(--gold); }
.chorus-mtile:hover .chorus-mplay svg{ fill:#fff; }

/* carousel chevrons + dots */
.chorus-marrow{ position:absolute; top:50%; transform:translateY(-50%); z-index:5;
  width:30px; height:30px; border-radius:50%; border:.5px solid rgba(251,248,241,.32);
  background:rgba(10,16,26,.5); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .18s var(--ease); }
.chorus-marrow.prev{ left:9px; } .chorus-marrow.next{ right:9px; }
.chorus-marrow svg{ width:12px; height:12px; stroke:#F4F0E6; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.chorus-marrow:hover{ background:var(--gold); border-color:var(--gold); }
.chorus-mdots{ position:absolute; left:0; right:0; bottom:10px; z-index:5; display:flex; justify-content:center; gap:5px; pointer-events:none; }
.chorus-mdot{ width:5px; height:5px; border-radius:50%; background:rgba(251,248,241,.42); transition:transform .2s, background .2s; }
.chorus-mdot.on{ background:#F4F0E6; transform:scale(1.3); }

/* footer caption + link */
.chorus-mfoot{ padding:12px 14px 14px; }
.chorus-mmeta{ display:inline-flex; align-items:center; gap:6px; margin-bottom:6px;
  font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(212,184,150,.85); }
.chorus-mmeta svg{ width:11px; height:11px; fill:currentColor; }
.chorus-mmeta .chorus-mdotsep{ opacity:.5; }
.chorus-mline{ font-family:var(--serif); font-weight:400; font-size:15px; line-height:1.2; letter-spacing:-.02em; color:#F4F0E6; }
.chorus-mcta{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; text-decoration:none;
  font-size:9.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:#D4B896;
  transition:color .15s; }
.chorus-mcta:hover{ color:#F4F0E6; }
.chorus-mcta svg{ width:11px; height:11px; }

@media (prefers-reduced-motion:reduce){ .chorus-mtile{ opacity:1 !important; } .chorus-mtile, .chorus-mtrack{ transition:none !important; } }

/* coming-soon veil (set COMING_SOON=true in the script) */
.chorus-mosaic-shell{ position:relative; }
.chorus-mosaic-shell.soon .chorus-mosaic{ filter:blur(9px); pointer-events:none; -webkit-user-select:none; user-select:none; }
.chorus-soon{ display:none; }
.chorus-mosaic-shell.soon .chorus-soon{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
  position:absolute; inset:0; z-index:6; padding:24px;
}
.chorus-soon-badge{
  display:inline-block; padding:8px 20px; border-radius:100px;
  background:rgba(184,150,110,.16); border:.5px solid rgba(184,150,110,.5);
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#D4B896;
}
.chorus-soon-title{
  font-family:var(--serif); font-weight:400; font-size:clamp(30px,4vw,46px);
  line-height:1.03; letter-spacing:-.04em; color:#F4F0E6; margin:0;
}
.chorus-soon-title em{ font-style:italic; color:#D4B896; }
.chorus-soon-sub{ font-family:var(--gara); font-style:italic; font-size:15px; color:rgba(244,240,230,.7); margin:0; max-width:38ch; }
</style>

<div class="sl-chorus chorus-section">
  <div class="chorus-wrap">
    <div class="chorus-mosaic-shell" id="chorusMosaicShell">
      <div class="chorus-mosaic" id="chorusMosaic"></div>
      <div class="chorus-soon">
        <span class="chorus-soon-badge">Coming soon</span>
        <h3 class="chorus-soon-title">More guest moments,<br><em>on the way.</em></h3>
        <p class="chorus-soon-sub">We are gathering our favourite reels and posts. Check back shortly.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* Flip to false once all the posts are ready to go live */
  var COMING_SOON = true;

  /* ── SOCIAL CONFIG - edit here ──
     images: paste the post's image url(s). 2+ = chevrons appear. */
  var POSTS = [
    { platform:'instagram', url:'https://www.instagram.com/p/DZWkjOwCFFK/',                shape:'portrait',  images:[], account:'@chantydemarillac', city:'London',    line:'Chanty’s go-to spots for coffee, pastries & dinners while studying in London' },
    { platform:'instagram', url:'https://www.instagram.com/p/REPLACE_ME_2/',              shape:'square',    images:[], account:'@studentluxe', city:'London',    line:'Inside a Luxe two-bed' },
    { platform:'instagram', url:'https://www.instagram.com/reel/REPLACE_ME_3/',           shape:'reel',      images:[], account:'@studentluxe', city:'Paris',     line:'A week in Père Lachaise' },
    { platform:'youtube',   url:'https://youtu.be/REPLACE_ME_4',                          shape:'landscape', images:[], account:'@studentluxe', city:'New York',  line:'Columbus Residences tour' },
    { platform:'instagram', url:'https://www.instagram.com/p/REPLACE_ME_5/',              shape:'square',    images:[], account:'@studentluxe', city:'Madrid',    line:'Golden hour on the terrace' }
  ];

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sqImg(u){ return (u && u.indexOf('squarespace-cdn.com')>-1) ? u.split('?')[0]+'?format=750w' : u; }
  /* YouTube thumbnails are public - no API needed - so YT tiles auto-preview */
  function ytThumb(url){ var m=String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{6,})/); return m ? 'https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg' : null; }

  var ICON_TT = '<svg viewBox="0 0 24 24"><path d="M16.6 3c.4 2.2 1.8 3.9 4.4 4.1v3c-1.7 0-3.2-.5-4.4-1.4v6.6c0 3.7-2.6 6.2-6 6.2-3.3 0-5.9-2.4-5.9-5.8 0-3.3 2.6-5.9 6-5.9.3 0 .7 0 1 .1v3.2c-.3-.1-.6-.2-1-.2-1.6 0-2.8 1.2-2.8 2.8 0 1.6 1.2 2.7 2.7 2.7 1.6 0 2.9-1.2 2.9-3.1V3h3.1z"/></svg>';
  var ICON_IG = '<svg viewBox="0 0 24 24"><path d="M12 4.3c2.5 0 2.8 0 3.8.1 1 0 1.5.2 1.8.3.5.2.8.4 1.1.7.3.3.5.7.7 1.1.1.3.3.9.3 1.8.1 1 .1 1.3.1 3.8s0 2.8-.1 3.8c0 1-.2 1.5-.3 1.8-.2.5-.4.8-.7 1.1-.3.3-.7.5-1.1.7-.3.1-.9.3-1.8.3-1 .1-1.3.1-3.8.1s-2.8 0-3.8-.1c-1 0-1.5-.2-1.8-.3-.5-.2-.8-.4-1.1-.7-.3-.3-.5-.7-.7-1.1-.1-.3-.3-.9-.3-1.8-.1-1-.1-1.3-.1-3.8s0-2.8.1-3.8c0-1 .2-1.5.3-1.8.2-.5.4-.8.7-1.1.3-.3.7-.5 1.1-.7.3-.1.9-.3 1.8-.3 1-.1 1.3-.1 3.8-.1M12 2.6c-2.6 0-2.9 0-3.9.1-1 0-1.7.2-2.3.4-.7.3-1.2.6-1.7 1.1-.5.5-.9 1.1-1.1 1.7-.2.6-.4 1.3-.4 2.3-.1 1-.1 1.3-.1 3.9s0 2.9.1 3.9c0 1 .2 1.7.4 2.3.3.7.6 1.2 1.1 1.7.5.5 1.1.9 1.7 1.1.6.2 1.3.4 2.3.4 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c1 0 1.7-.2 2.3-.4.7-.3 1.2-.6 1.7-1.1.5-.5.9-1.1 1.1-1.7.2-.6.4-1.3.4-2.3.1-1 .1-1.3.1-3.9s0-2.9-.1-3.9c0-1-.2-1.7-.4-2.3-.3-.7-.6-1.2-1.1-1.7-.5-.5-1.1-.9-1.7-1.1-.6-.2-1.3-.4-2.3-.4-1-.1-1.3-.1-3.9-.1zm0 4.6c-2.7 0-4.9 2.2-4.9 4.9s2.2 4.9 4.9 4.9 4.9-2.2 4.9-4.9-2.2-4.9-4.9-4.9zm0 8c-1.7 0-3.1-1.4-3.1-3.1 0-1.7 1.4-3.1 3.1-3.1 1.7 0 3.1 1.4 3.1 3.1 0 1.7-1.4 3.1-3.1 3.1zm5-9.3c-.6 0-1.1.5-1.1 1.1s.5 1.1 1.1 1.1 1.1-.5 1.1-1.1-.5-1.1-1.1-1.1z"/></svg>';
  var ICON_YT = '<svg viewBox="0 0 24 24"><path d="M23 7.5c-.3-1-1-1.8-2-2.1C19.2 5 12 5 12 5s-7.2 0-9 .4c-1 .3-1.7 1.1-2 2.1C.6 9.3.6 12 .6 12s0 2.7.4 4.5c.3 1 1 1.8 2 2.1 1.8.4 9 .4 9 .4s7.2 0 9-.4c1-.3 1.7-1.1 2-2.1.4-1.8.4-4.5.4-4.5s0-2.7-.4-4.5zM9.7 15.4V8.6l6 3.4-6 3.4z"/></svg>';
  var ICON_STACK = '<svg viewBox="0 0 24 24"><path d="M8 3h11a2 2 0 0 1 2 2v11h-2V5H8V3zm-3 4h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.8v14.4c0 .7.8 1.2 1.4.8l11-7.2c.6-.4.6-1.2 0-1.6l-11-7.2c-.6-.4-1.4.1-1.4.8z"/></svg>';
  var SPARK = '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4L12 3z" fill="rgba(212,184,150,.7)"/></svg>';
  var ARROW = '<svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV_L = '<svg viewBox="0 0 14 14"><polyline points="9,2 4,7 9,12"/></svg>';
  var CHEV_R = '<svg viewBox="0 0 14 14"><polyline points="5,2 10,7 5,12"/></svg>';

  var META = {
    tiktok:    { icon:ICON_TT, name:'TikTok',    cta:'Watch on TikTok' },
    instagram: { icon:ICON_IG, name:'Instagram', cta:'View post on Instagram' },
    youtube:   { icon:ICON_YT, name:'YouTube',   cta:'Watch on YouTube' }
  };

  var io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin:'0px 0px -6% 0px', threshold:0.04 })
    : null;
  function reveal(el){ if(io){ io.observe(el); } else { el.classList.add('in'); } }

  var wrap = document.getElementById('chorusMosaic');
  if(!wrap) return;
  if(COMING_SOON){ var shell = document.getElementById('chorusMosaicShell'); if(shell) shell.classList.add('soon'); }

  function openPost(url){ if(COMING_SOON) return; window.open(url, '_blank', 'noopener'); }

  POSTS.forEach(function(p){
    var meta = META[p.platform] || META.instagram;
    var shape = ({reel:1,portrait:1,square:1,landscape:1}[p.shape]) ? p.shape : 'reel';
    var imgs = (p.images && p.images.length) ? p.images.slice() : [];
    if(!imgs.length && p.platform === 'youtube'){ var yt = ytThumb(p.url); if(yt) imgs = [yt]; }
    var multi = imgs.length > 1;
    var isVideo = !multi && (shape === 'reel' || shape === 'landscape' || p.platform === 'tiktok' || p.platform === 'youtube');

    var tile = document.createElement('div');
    tile.className = 'chorus-mtile';

    var inner = '';
    if(imgs.length){
      inner = '<div class="chorus-mtrack">' + imgs.map(function(src){
        return '<div class="chorus-mslide"><img src="' + esc(sqImg(src)) + '" alt="' + esc(p.line || meta.name) + '" loading="lazy" decoding="async" draggable="false"></div>';
      }).join('') + '</div>';
    } else {
      inner = '<div class="chorus-mfallback">' + SPARK + '<span>' + esc(meta.name) + '</span></div>';
    }

    tile.innerHTML =
      '<div class="chorus-mmedia ' + shape + '">' +
        inner +
        '<div class="chorus-mtop"><span class="chorus-mavatar">' + meta.icon + '</span>' +
          (p.account ? '<span class="chorus-mhandle">' + esc(p.account) + '</span>' : '') +
          (multi ? '<span class="chorus-mcount">' + ICON_STACK + '</span>' : '') +
        '</div>' +
        (isVideo ? '<span class="chorus-mplay">' + PLAY + '</span>' : '') +
        (multi ? '<button class="chorus-marrow prev" type="button" aria-label="Previous image">' + CHEV_L + '</button>' +
                 '<button class="chorus-marrow next" type="button" aria-label="Next image">' + CHEV_R + '</button>' +
                 '<div class="chorus-mdots">' + imgs.map(function(_,i){ return '<span class="chorus-mdot' + (i===0?' on':'') + '"></span>'; }).join('') + '</div>' : '') +
      '</div>' +
      '<div class="chorus-mfoot">' +
        '<span class="chorus-mmeta">' + meta.icon + ' ' + esc(meta.name) +
          (p.city ? ' <span class="chorus-mdotsep">/</span> ' + esc(p.city) : '') +
        '</span>' +
        (p.line ? '<div class="chorus-mline">' + esc(p.line) + '</div>' : '') +
        '<a class="chorus-mcta" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(meta.cta) + ' ' + ARROW + '</a>' +
      '</div>';

    var media = tile.querySelector('.chorus-mmedia');

    /* carousel wiring */
    if(multi){
      var track = tile.querySelector('.chorus-mtrack');
      var dots  = tile.querySelectorAll('.chorus-mdot');
      var idx = 0, n = imgs.length;
      function go(i, anim){
        idx = (i + n) % n;
        track.classList.toggle('no-anim', anim === false);
        track.style.transform = 'translateX(' + (-idx*100) + '%)';
        dots.forEach(function(d,k){ d.classList.toggle('on', k===idx); });
      }
      tile.querySelector('.chorus-marrow.prev').addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); go(idx-1); });
      tile.querySelector('.chorus-marrow.next').addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); go(idx+1); });

      /* swipe (and tap-to-open when it wasn't a swipe) */
      var startX=0, dx=0, dragging=false, pid=null;
      media.addEventListener('pointerdown', function(e){
        if(e.target.closest('.chorus-marrow')) return;
        dragging=true; pid=e.pointerId; startX=e.clientX; dx=0;
        track.classList.add('no-anim');
        try{ media.setPointerCapture(pid); }catch(_){}
      });
      media.addEventListener('pointermove', function(e){
        if(!dragging) return;
        dx=e.clientX-startX;
        track.style.transform = 'translateX(' + (-idx*100 + (dx/media.offsetWidth)*100) + '%)';
      });
      function end(){
        if(!dragging) return; dragging=false;
        track.classList.remove('no-anim');
        if(Math.abs(dx) > 40){ go(idx + (dx<0?1:-1)); }
        else if(Math.abs(dx) < 6){ openPost(p.url); }   /* it was a tap */
        else { go(idx); }
        dx=0;
      }
      media.addEventListener('pointerup', end);
      media.addEventListener('pointercancel', end);
      media.addEventListener('dragstart', function(e){ e.preventDefault(); });
    } else {
      media.addEventListener('click', function(){ openPost(p.url); });
    }

    wrap.appendChild(tile);
    reveal(tile);
  });
})();
</script>
