<!-- ============================================================
     STUDENT LUXE - Chorus Reviews : SECTION 2 - TRUST STATS
     Self-contained. Paste into its own Code Block below the guests.
     Edit the STATS array + googleReviewsUrl in the script.
     ============================================================ -->
<style>
.sl-chorus{
  --card:#ffffff; --ink:#0d1a2e;
  --muted:rgba(13,26,46,.52); --hair:rgba(13,26,46,.12);
  --gold:#B8966E; --gold-deep:#8B6E4E; --gold-wash:rgba(184,150,110,.10);
  --shadow-card:0 1px 2px rgba(13,26,46,.05),0 12px 34px rgba(13,26,46,.08);
  --serif:'baskerville-display-pt',Georgia,'Times New Roman',serif;
  --sans:'dm-sans',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.sl-chorus *{ box-sizing:border-box; }
.sl-chorus.chorus-section{ padding:40px 24px; }
.sl-chorus .chorus-wrap{ max-width:1180px; margin:0 auto; }
.chorus-gg{ width:11px; height:11px; flex-shrink:0; display:inline-block; }

.chorus-stats{
  display:flex; align-items:stretch; flex-wrap:wrap; gap:0;
  background:var(--card); border:1px solid var(--hair); border-radius:16px;
  box-shadow:var(--shadow-card); overflow:hidden;
}
.chorus-stat{
  flex:1 1 0; min-width:150px; padding:26px 24px 22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  text-align:center; border-right:1px solid var(--hair);
}
.chorus-stat:last-child{ border-right:none; }
.chorus-stat-num{
  font-family:var(--serif); font-weight:400; font-size:clamp(30px,3.4vw,40px);
  line-height:1; letter-spacing:-.04em; color:var(--ink); display:flex; align-items:baseline; gap:6px;
}
.chorus-stat-num .chorus-stat-star{ width:20px; height:20px; fill:var(--gold); align-self:center; }
.chorus-stat-label{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.chorus-stat-label .chorus-gg{ width:12px; height:12px; }
.chorus-stat-stars{ display:flex; gap:3px; }
.chorus-stat-stars svg{ width:15px; height:15px; fill:var(--gold); }
.chorus-stat-link{ text-decoration:none; transition:background .2s; }
a.chorus-stat-link:hover{ background:var(--gold-wash); }
.chorus-stat-cta{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; color:var(--gold-deep); display:inline-flex; align-items:center; gap:7px; }
.chorus-stat-cta svg{ width:13px; height:13px; }
@media (max-width:760px){
  .chorus-stat{ flex:1 1 50%; min-width:0; border-bottom:1px solid var(--hair); padding:20px 14px 17px; }
  .chorus-stat:nth-child(2n){ border-right:none; }
  .chorus-stat:nth-last-child(-n+2){ border-bottom:none; }
}
@media (max-width:640px){ .sl-chorus.chorus-section{ padding:32px 16px; } }
</style>

<div class="sl-chorus chorus-section">
  <div class="chorus-wrap">
    <div class="chorus-stats" id="chorusStats"></div>
  </div>
</div>

<script>
(function(){
  /* ── STATS CONFIG - edit here ── */
  var googleReviewsUrl = 'https://www.google.com/search?q=Student+Luxe+reviews';   /* swap for your g.page review link */
  var STATS = [
    { num:'4.9', star:true, label:'Google rating', stars:true },
    { num:'200+',           label:'Verified reviews', google:true },
    { num:'2019',           label:'Trusted since' },
    { num:'6',              label:'Cities worldwide' }
  ];

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var STAR = '<svg viewBox="0 0 14 14"><polygon points="7,1 8.7,5 13,5.4 9.7,8.3 10.7,12.6 7,10.3 3.3,12.6 4.3,8.3 1,5.4 5.3,5"/></svg>';
  var STAR20 = '<svg class="chorus-stat-star" viewBox="0 0 14 14"><polygon points="7,1 8.7,5 13,5.4 9.7,8.3 10.7,12.6 7,10.3 3.3,12.6 4.3,8.3 1,5.4 5.3,5"/></svg>';
  var GOOGLE_G = '<svg class="chorus-gg" viewBox="0 0 48 48" aria-hidden="true">' +
    '<path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>' +
    '<path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>' +
    '<path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>' +
    '<path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7C13.42 14.62 18.27 10.75 24 10.75z"/></svg>';

  var wrap = document.getElementById('chorusStats');
  if(!wrap) return;
  wrap.innerHTML = STATS.map(function(s){
    var num = '<div class="chorus-stat-num">' + esc(s.num) + (s.star ? STAR20 : '') + '</div>';
    var label = '<div class="chorus-stat-label">' + (s.google ? GOOGLE_G : '') + esc(s.label) + '</div>';
    var stars = s.stars ? '<div class="chorus-stat-stars">' + STAR + STAR + STAR + STAR + STAR + '</div>' : '';
    return '<div class="chorus-stat">' + num + stars + label + '</div>';
  }).join('') +
  '<a class="chorus-stat chorus-stat-link" href="' + esc(googleReviewsUrl) + '" target="_blank" rel="noopener">' +
    '<div class="chorus-stat-cta">' + GOOGLE_G + ' See all on Google' +
      '<svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</div>' +
  '</a>';
})();
</script>
